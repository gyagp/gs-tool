<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}#viewer{position:relative;width:100vw;height:100vh}</style></head>
<body><div id="viewer"></div><script type="module">
import { ImportedRenderer } from '../src/webgpu/importedRenderer';
window.ready = false;
window.loadModel = async () => {
  const bytes = await (await fetch('/private-test-model.ply')).arrayBuffer();
  const renderer = new ImportedRenderer(document.querySelector('#viewer'));
  await renderer.load(new File([bytes], 'trained.ply'));
  window.pose = null;
  const loop = () => {
    requestAnimationFrame(loop);
    const p = window.pose;
    if (p) renderer.render(p.eye, p.target, p.fov, p.width, p.height, p.up);
  };
  loop(); window.ready = true;
};
</script></body></html>
